# Undal — create the release keystore once. Licensed under PASVL-1.0.
#
# The keystore is generated on a runner, printed once as base64 into the job
# summary, and never stored anywhere else. Whoever runs this copies the four
# values into repository secrets and then clears the summary; the workflow keeps
# no artifact because a keystore in an artifact is a keystore in a cache.
name: generate-keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type keystore to generate a new signing key"
        required: true
      alias:
        description: "Key alias"
        default: undal

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirm
        run: test "${{ inputs.confirm }}" = "keystore"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate a 4096-bit RSA key valid for 30 years
        run: |
          PASSWORD="$(openssl rand -base64 32)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/undal.jks" \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Undal, O=Undal Technologies, L=Sylhet, C=BD"
          {
            echo "### Store these as repository secrets, then clear this summary"
            echo ""
            echo '```'
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w 0 "$RUNNER_TEMP/undal.jks")"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
            echo "ANDROID_KEY_ALIAS=${{ inputs.alias }}"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Shred the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/undal.jks"
