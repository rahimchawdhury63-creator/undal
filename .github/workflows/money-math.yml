# Undal — the three-language money differential. Licensed under PASVL-1.0.
#
# 110 000 seeded amount/rate pairs, computed in TypeScript, Python and Kotlin,
# compared byte for byte. This is the workflow that makes the money law true
# rather than aspirational: `apply_rate` has one rounding rule and any language
# that disagrees fails the build on the vector that disagrees.
name: money-math

on:
  push:
    paths:
      - "packages/money/**"
      - "scripts/money/**"
      - "android/shared/money/**"
      - ".github/workflows/money-math.yml"
  pull_request:
    paths:
      - "packages/money/**"
      - "android/shared/money/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper is committed: the distribution is pinned here so a runner cannot
          # pick a Gradle version by accident and report a build nobody has run.
          gradle-version: "8.10.2"
      - run: pnpm install --frozen-lockfile
      - name: TypeScript vectors and answers
        run: node --experimental-strip-types packages/money/test/differential.ts
      - name: Kotlin answers over the same vectors
        working-directory: android
        run: gradle :shared:money:kotlinDifferential --no-daemon
      - name: Compare all three
        run: python3 scripts/money/differential.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: money-differential
          path: .artifacts/money/
          retention-days: 30
