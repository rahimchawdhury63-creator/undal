# Undal — debug APKs for the three Android apps. Licensed under PASVL-1.0.
#
# Debug builds are unsigned, installable and disposable: they exist so a change
# can be looked at from a tablet without a laptop, by downloading the artifact
# from the run page.
name: android-debug

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
    # The app modules arrive in their own responses (R17–R19). The gate is the module's own
    # build file, so the job switches on the moment the module lands — it is not a date, a
    # label or a switch somebody has to remember to flip.
  assemble:
    if: hashFiles(format('android/app/{0}/build.gradle.kts', matrix.app)) != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [undal, partner, rider]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper is committed: the distribution is pinned here so a runner cannot
          # pick a Gradle version by accident and report a build nobody has run.
          gradle-version: "8.10.2"
      - name: Assemble the debug APK
        working-directory: android
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: gradle ":app:${{ matrix.app }}:assembleDebug" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: undal-${{ matrix.app }}-debug
          path: android/app/${{ matrix.app }}/build/outputs/apk/debug/*.apk
          retention-days: 14
