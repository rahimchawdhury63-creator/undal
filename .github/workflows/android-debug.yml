# Undal — debug APKs for the three Android apps. Licensed under PASVL-1.0.
#
# Debug builds are unsigned, installable and disposable: they exist so a change
# can be looked at from a tablet without a laptop, by downloading the artifact
# from the run page.
name: android-debug

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [undal, partner, rider]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the debug APK
        working-directory: android
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: ./gradlew ":app:${{ matrix.app }}:assembleDebug" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: undal-${{ matrix.app }}-debug
          path: android/app/${{ matrix.app }}/build/outputs/apk/debug/*.apk
          retention-days: 14
