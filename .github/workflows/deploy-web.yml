# Undal — deploy the storefront to Cloudflare Pages. Licensed under PASVL-1.0.
#
# The storefront and the admin panel are two builds of one Pages project: the
# storefront owns `/`, the admin owns `/admin/*`. They deploy separately and
# independently, and each refuses to publish if its own build is red.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "web/storefront/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch'
        run: test "${{ inputs.confirm }}" = "deploy"
      - run: pnpm install --frozen-lockfile
      - name: Unit and component tests
        run: pnpm --filter @undal/storefront test
      - name: Pre-render every public route
        run: pnpm --filter @undal/storefront build
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      - name: Verify the pre-render really shipped content
        run: node web/storefront/scripts/verify-prerender.mjs
      - name: Publish to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy web/storefront/dist --project-name undal --branch main
