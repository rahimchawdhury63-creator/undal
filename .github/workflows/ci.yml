name: UNDAL Constitutional CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-web-workers-gates:
    name: TypeScript, Web Builds, PGlite SQL, Fuzz & Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm ci

      - name: Typecheck all 6 TS workspaces, build Vite apps, run tests & check gates
        run: npm run ci:all

      - name: Scan git history & working tree for leaked secrets (gitleaks)
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact

  postgres-migrations-and-pgtap:
    name: PostgreSQL 16 Migrations Reset & pgTAP Security Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start PostgreSQL 16 & install pgTAP + pg_prove
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres createdb undal_test

      - name: Apply Supabase local bootstrap + ordered migrations (clean + idempotency pass)
        run: |
          set -euo pipefail
          sudo -u postgres psql -d undal_test -v ON_ERROR_STOP=1 -f supabase/tests/_bootstrap_supabase_local.sql
          for pass in 1 2; do
            echo "=== Applying ordered migrations (pass #${pass}) ==="
            for mig in supabase/migrations/*.sql; do
              echo "  -> $mig"
              sudo -u postgres psql -d undal_test -v ON_ERROR_STOP=1 -f "$mig"
            done
          done

      - name: Run pgTAP RLS, RBAC & immutability suite via pg_prove
        run: |
          set -euo pipefail
          sudo -u postgres pg_prove -d undal_test --verbose supabase/tests/*.pgtap.sql

  flutter-packages-and-apps:
    name: Flutter Analyze & Widget/Golden Math Tests (4 Packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter SDK (pinned & cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Analyze & test package:undal_core + all 3 Flutter apps
        run: |
          set -euo pipefail
          FAILED=0
          for pkg in packages/undal_core apps/customer_app apps/partner_app apps/rider_app; do
            echo "=== Testing Flutter workspace: $pkg ==="
            LOG_FILE="$(mktemp)"
            if ! (cd "$pkg" && flutter pub get && flutter analyze && flutter test --reporter expanded) >"$LOG_FILE" 2>&1; then
              cat "$LOG_FILE"
              SUMMARY="$(tail -n 35 "$LOG_FILE" | tr '\n' ' ' | sed 's/%/%25/g')"
              echo "::error title=Flutter failure in $pkg::$SUMMARY"
              FAILED=1
            else
              cat "$LOG_FILE"
            fi
          done
          exit "$FAILED"

  bootstrap-dry-run:
    name: Keystore & Super-Admin Bootstrap Dry-Run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Temurin JDK 21 (for keytool ceremony verification)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Dry-run RSA-2048 keystore ceremony & Base64 round-trip check
        run: |
          set -euo pipefail
          TMP_CEREMONY="$(mktemp -d)"
          trap 'rm -rf "$TMP_CEREMONY"' EXIT
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$TMP_CEREMONY/release.jks" -storetype PKCS12 \
            -alias undal-release -keyalg RSA -keysize 2048 -validity 9125 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=UNDAL Food Delivery, OU=Mobile Engineering, O=UNDAL, L=Sylhet, S=Sylhet, C=BD" >/dev/null 2>&1
          base64 -w 0 "$TMP_CEREMONY/release.jks" > "$TMP_CEREMONY/release.b64"
          base64 -d "$TMP_CEREMONY/release.b64" > "$TMP_CEREMONY/decoded.jks"
          FP="$(keytool -list -v -keystore "$TMP_CEREMONY/decoded.jks" -storepass "$PASS" -alias undal-release | awk '/SHA256:/{print $2; exit}')"
          test -n "$FP"
          echo "[keystore-dry-run] PASS — PKCS12 RSA-2048 9125d base64 round-trip & SHA-256 fingerprint verified."

      - name: Dry-run idempotent Super Admin bootstrap
        run: node infra/scripts/bootstrap-admin.mjs --dry-run
