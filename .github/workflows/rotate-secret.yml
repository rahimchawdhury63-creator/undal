# Undal — guided secret rotation. Licensed under PASVL-1.0.
#
# Every credential that can be rotated is rotated without a deploy, and every one
# that cannot is a design defect. The dual-key entries (JWT_PREVIOUS_KEY,
# ORDER_QR_PREVIOUS_SECRET) exist so a rotation has no window in which a live
# session or a scanned QR code is rejected: accept both, then drop the old.
name: rotate-secret

on:
  workflow_dispatch:
    inputs:
      secret:
        description: "Secret name exactly as in docs/29"
        required: true
      confirm:
        description: "Type rotate to confirm"
        required: true

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Confirm and describe the blast radius
        env:
          SECRET_NAME: ${{ inputs.secret }}
        run: |
          test "${{ inputs.confirm }}" = "rotate"
          python3 scripts/ci/secret-blast-radius.py --name "$SECRET_NAME"
      - name: Rotate
        env:
          SECRET_NAME: ${{ inputs.secret }}
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: python3 scripts/ci/rotate-secret.py --name "$SECRET_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: rotation-record
          path: .artifacts/rotation/*.json
          retention-days: 365
