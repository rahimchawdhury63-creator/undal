name: Keystore Generate (Android Signing Ceremony)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run verification only (set false ONLY once when saving production signing secrets)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: keystore-generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keystore-ceremony:
    name: Generate & Verify Release Keystore (${{ inputs.dry_run && 'DRY RUN' || 'LIVE CEREMONY' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21 (for keytool)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate RSA-2048 9125-day keystore, round-trip Base64 & verify SHA-256
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          CEREMONY_DIR="$(mktemp -d)"
          trap 'rm -rf "$CEREMONY_DIR"' EXIT

          KEY_ALIAS="undal-release"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          echo "::add-mask::$STORE_PASS"

          JKS_PATH="$CEREMONY_DIR/undal-release.jks"
          B64_PATH="$CEREMONY_DIR/undal-release.b64"
          ROUNDTRIP_JKS="$CEREMONY_DIR/undal-roundtrip.jks"

          keytool -genkeypair \
            -v \
            -keystore "$JKS_PATH" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=UNDAL Food Delivery, OU=Mobile Engineering, O=UNDAL, L=Sylhet, S=Sylhet, C=BD" >/dev/null 2>&1

          base64 -w 0 "$JKS_PATH" > "$B64_PATH"
          base64 -d "$B64_PATH" > "$ROUNDTRIP_JKS"

          SHA256_FP="$(keytool -list -v -keystore "$ROUNDTRIP_JKS" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" \
            | awk '/SHA256:/{print $2; exit}')"

          if [ -z "$SHA256_FP" ]; then
            echo "Failed to extract SHA-256 certificate fingerprint." >&2
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "## Keystore Dry-Run Verification Passed"
              echo ""
              echo "- **Keystore Format:** PKCS12 (`RSA 2048`, `9125` days / 25 years, alias `undal-release`)"
              echo "- **Base64 Round-Trip Size:** $(wc -c < "$B64_PATH") chars (decoded & verified cleanly)"
              echo "- **Ephemeral Test Cert SHA-256:** \`$SHA256_FP\` *(discarded immediately on job exit)*"
              echo ""
              echo "> **Next step for Founder (Android Tablet Browser):** Re-run this workflow with **`dry_run = false`** once ready to mint your permanent signing identity and copy the 4 secrets (`KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`) into **Settings → Secrets and variables → Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## UNDAL Production Signing Keystore Generated (SAVE IMMEDIATELY + OFFLINE BACKUP)"
              echo ""
              echo "> **CRITICAL WARNING (×3):** Back up these 4 values both in **GitHub Actions Secrets** AND in a safe offline password manager. Losing your release keystore means Google Play will never accept updates to the same app package!"
              echo ""
              echo "| GitHub Secret Name | Value |"
              echo "|---|---|"
              echo "| \`KEY_ALIAS\` | \`$KEY_ALIAS\` |"
              echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PASS\` |"
              echo "| \`KEY_PASSWORD\` | \`$KEY_PASS\` |"
              echo "| \`ANDROID_CERT_SHA256\` *(for \`.well-known/assetlinks.json\` Variable)* | \`$SHA256_FP\` |"
              echo ""
              echo "### \`KEYSTORE_BASE64\`"
              echo '```text'
              cat "$B64_PATH"
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
