#
# The Android build, on a runner that has what this repository's sandbox does not: a JDK, the
# Android SDK and a network. It exists because Kotlin that has never been compiled is a claim, and
# this project does not ship claims.

name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "docs/api/surface.json"
  pull_request:
    paths:
      - "android/**"

permissions:
  contents: read

jobs:
  jvm:
    name: shared modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # `money` and `api` are plain JVM libraries: no SDK, no emulator, seconds per run.
      # Run it into a file so a failure can be lifted into an annotation: the raw job log is
      # served from a host this environment cannot reach, and an error you cannot read is an
      # error you cannot fix.
      - name: test
        working-directory: android
        run: |
          set -o pipefail
          gradle :shared:money:test :shared:api:test --no-daemon --stacktrace 2>&1 | tee build.log
      - name: surface the first errors
        if: failure()
        working-directory: android
        run: |
          # Every line becomes an annotation, because that is the only channel this environment
          # can read back. Truncated by GitHub, so the first errors and the last words both go in.
          # Compiler diagnostics only: an annotation is short, and a note about jvmargs is not
          # what anybody needs to read.
          grep -m 6 -E "^e: |Caused by:" build.log | sed 's/^/::error::/' || echo "::error::build.log has no compiler diagnostics"
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: android/shared/*/build/reports/tests/
          retention-days: 7

  routes-current:
    name: generated routes are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The Kotlin route table is generated from the same file the Worker publishes. If somebody
      # changes a route and does not regenerate, the phone would 404 in the field.
      - run: node scripts/gen-android-routes.mjs
