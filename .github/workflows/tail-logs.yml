# Undal — Worker tail into the job summary. Licensed under PASVL-1.0.
#
# `wrangler tail` streams for as long as the process lives, so the workflow opens
# it for a bounded number of seconds and prints what arrived. This is the
# replacement for tailing a log on a laptop: the output is in the run summary,
# readable from the same tablet that triggered it.
name: tail-logs

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Which Worker"
        type: choice
        options: [undal-core, undal-realtime, undal-brain]
        default: undal-core
      seconds:
        description: "How long to listen"
        default: "60"

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
      - run: pnpm install --frozen-lockfile
      - name: Stream for a bounded window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ inputs.worker }}
          SECONDS_TO_TAIL: ${{ inputs.seconds }}
        run: pnpm exec wrangler tail "$WORKER" --format=pretty & sleep "$SECONDS_TO_TAIL"; kill %1
