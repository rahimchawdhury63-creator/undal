# Undal — deploy the admin panel to the same Pages project. Licensed under
# PASVL-1.0.
#
# Admin assets live under `/admin/*` inside the one project, with a CSP scoped to
# that path (D34): one deployment, one domain, one cookie jar, no cross-origin
# session problems, and no chance of an admin bundle being served at the root.
name: deploy-admin

on:
  push:
    branches: [main]
    paths:
      - "web/admin/**"
      - "packages/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch'
        run: test "${{ inputs.confirm }}" = "deploy"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @undal/admin test
      - name: Build with the `/admin` base path
        run: pnpm --filter @undal/admin build
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          PUBLIC_ADMIN_BASE: /admin
      - name: Assert the CSP is scoped to /admin
        run: node web/admin/scripts/verify-csp.mjs
      - name: Publish to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy web/admin/dist --project-name undal --branch main
