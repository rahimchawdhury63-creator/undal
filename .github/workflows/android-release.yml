# Undal — signed APK and AAB for the three apps. Licensed under PASVL-1.0.
#
# Signing happens here and nowhere else. The keystore exists only as four
# Actions secrets, is never written into the repository, and the build fails
# closed if any of them is missing — an unsigned artifact is worse than no
# artifact, because someone will eventually ship it.
name: android-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.4.2"
        required: true
      version_code:
        description: "Monotonic version code"
        required: true

permissions:
  contents: write

jobs:
    # The app modules arrive in their own responses (R17–R19). The gate is the module's own
    # build file, so the job switches on the moment the module lands — it is not a date, a
    # label or a switch somebody has to remember to flip.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [undal, partner, rider]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          # No wrapper is committed: the distribution is pinned here so a runner cannot
          # pick a Gradle version by accident and report a build nobody has run.
          gradle-version: "8.10.2"
      - name: Refuse to build without the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || { echo "a signing secret is empty"; exit 1; }
          done
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/undal.jks"
      - name: Assemble and bundle
        working-directory: android
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/undal.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          gradle ":app:${{ matrix.app }}:assembleRelease" ":app:${{ matrix.app }}:bundleRelease" \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --no-daemon
      - name: Checksums
        run: |
          cd "android/app/${{ matrix.app }}/build/outputs"
          find . -name '*.apk' -o -name '*.aab' | sort | xargs sha256sum > "$RUNNER_TEMP/${{ matrix.app }}-sha256.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: undal-${{ matrix.app }}-release
          path: |
            android/app/${{ matrix.app }}/build/outputs/apk/release/*.apk
            android/app/${{ matrix.app }}/build/outputs/bundle/release/*.aab
            ${{ runner.temp }}/${{ matrix.app }}-sha256.txt
          retention-days: 90
