# Undal — instrumented tests on real devices. Licensed under PASVL-1.0.
#
# Only one thing here cannot be tested on a JVM: the alarm. Whether a
# full-screen intent actually wakes a locked phone, whether the shipped WAV
# loops from t=0 at `USAGE_ALARM` volume, and whether a data-only, high-priority
# message reaches a backgrounded app. Firebase Test Lab runs the matrix nightly
# on the physical device profiles Android actually sells in Bangladesh.
name: android-instrumented

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Test Lab device model"
        default: "redfin"
  schedule:
    - cron: "41 19 * * *"   # 01:41 Asia/Dhaka

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the alarm test APKs
        working-directory: android
        run: ./gradlew :shared:alarm:assembleDebug :shared:alarm:assembleDebugAndroidTest --no-daemon
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run on Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app android/shared/alarm/build/outputs/apk/debug/alarm-debug.apk \
            --test android/shared/alarm/build/outputs/apk/androidTest/debug/alarm-debug-androidTest.apk \
            --device model=${{ inputs.device || 'redfin' }},version=30,locale=bn,orientation=portrait \
            --timeout 20m \
            --results-dir "alarm-${GITHUB_RUN_ID}" \
            --results-bucket "gs://undal-test-lab"
