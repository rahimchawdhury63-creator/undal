# Undal — retention, orphan cleanup and the audit chain. Licensed under PASVL-1.0.
#
# Read-only diagnostics only. The legacy audit check is necessarily INCOMPLETE
# and returns nonzero; it must not be presented as proof of chain integrity.
# Retention deletion stays disabled pending policy and safety review.
name: housekeeping

on:
  workflow_dispatch:
  schedule:
    - cron: "47 19 * * *"   # 01:47 Asia/Dhaka

permissions:
  contents: read

jobs:
  housekeeping:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit chain walk
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: python3 scripts/db/housekeeping.py audit-chain --out .artifacts/housekeeping/audit-chain.json
      - name: Orphan sweep
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: python3 scripts/db/housekeeping.py orphans --out .artifacts/housekeeping/orphans.json
      - name: Report retention candidates (deletion disabled)
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: python3 scripts/db/housekeeping.py retention --dry-run --out .artifacts/housekeeping/retention.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: housekeeping
          path: .artifacts/housekeeping/
          retention-days: 30
