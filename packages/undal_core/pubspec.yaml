name: undal_core
description: Canonical UNDAL shared Flutter foundation package (design tokens, Material 3 theme, rational money/fare engines, EN/BN i18n, responsive scaffold).
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/brand/undal-logo-primary.svg
    - assets/brand/undal-icon.svg
    - assets/brand/undal-mono.svg
    - assets/sounds/undal_order_alert_loop.wav
