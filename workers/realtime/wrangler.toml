# Undal — undal-realtime. Licensed under PASVL-1.0.
#
# The only paid dependency in the entire platform is the Durable Object used by
# the `durable-object` coordination backend, and it is unused at launch: the
# `sql` backend is the default and costs nothing. No cron lives here either.
name = "undal-realtime"
main = "src/index.ts"
compatibility_date = "2024-10-01"

[durable_objects]
bindings = [
  { name = "ORDER_ROOM", class_name = "OrderRoom" },
  # The coordination room is only used when COORDINATION_MODE = "durable-object"; the binding exists so
  # flipping the variable is the whole upgrade. The free `sql` backend uses no Durable Object at all.
  { name = "COORDINATION_ROOM", class_name = "CoordinationRoom" },
  # One room per stream channel, so a broadcast survives the isolate that recorded it.
  { name = "STREAM_ROOM", class_name = "StreamRoom" },
  # One room per zone, holding that zone's presence sockets. A room per zone rather than one for the
  # platform, because presence is a safety signal and a single room would put every zone's heartbeats in
  # one failure domain.
  { name = "ZONE_HUB", class_name = "ZoneHub" },
  # One room per order, holding the two-minute vendor ladder and the alarm that walks it (D84).
  { name = "VENDOR_ALARM", class_name = "VendorAlarm" },
]

[[migrations]]
tag = "v1"
new_classes = ["OrderRoom"]

[[migrations]]
tag = "v2"
new_classes = ["CoordinationRoom"]

[[migrations]]
tag = "v3"
new_classes = ["StreamRoom"]

[[migrations]]
tag = "v4"
new_classes = ["ZoneHub"]

[[migrations]]
tag = "v5"
new_classes = ["VendorAlarm"]

[vars]
PUBLIC_API_BASE = "https://api.undal.app"
CORE_BASE_URL = "https://api.undal.app"
COORDINATION_MODE = "sql"

# Secrets are never written here. `undal-realtime` is given `JWT_PUBLIC_KEY` (the public half of the
# session signing key, base64url JWK) so it can verify a token and cannot mint one (`29 §2.6`).
